name: AscensionNotes
options:
  bundleIdPrefix: com.gravitywizard.ascension
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AscensionCore:
    type: framework
    platform: [macOS, iOS]
    sources:
      - path: Sources/AscensionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitywizard.ascension.core

  AscensionNotesApp:
    type: application
    platform: [macOS, iOS]
    sources:
      - path: Sources/AscensionNotesApp
    dependencies:
      - target: AscensionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitywizard.ascension.notes
        PRODUCT_NAME: "Ascension Notes"
        INFOPLIST_KEY_CFBundleDisplayName: "Ascension Notes"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  AscensionCoreTests:
    type: bundle.unit-test
    platform: [macOS, iOS]
    sources:
      - path: Tests/AscensionCoreTests
    dependencies:
      - target: AscensionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitywizard.ascension.core.tests
        GENERATE_INFOPLIST_FILE: YES
