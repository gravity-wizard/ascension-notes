name: AscensionNotes
options:
  bundleIdPrefix: com.gravitywizard.ascension
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  AscensionLocal:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AscensionNotesApp:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources/AscensionNotesApp
    dependencies:
      - package: AscensionLocal
        product: AscensionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitywizard.ascension.notes
        PRODUCT_NAME: "Ascension Notes"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Ascension Notes"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        "INFOPLIST_KEY_NSPrincipalClass[sdk=macosx*]": NSApplication
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphoneos*]": UIInterfaceOrientationPortrait
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphoneos*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - AscensionCoreTests

  AscensionCoreTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Tests/AscensionCoreTests
    dependencies:
      - package: AscensionLocal
        product: AscensionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitywizard.ascension.core.tests
        GENERATE_INFOPLIST_FILE: YES
