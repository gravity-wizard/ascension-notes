name: Test & Deploy Twisted23 Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "python/**"
      - ".github/workflows/deploy-twisted23.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Run Python core unit tests
        run: python3 -m unittest discover -s python/tests -p "test_*.py" -v

      - name: Run Twisted23 web integration & cache tests
        run: cd web && npm test

      - name: Lint Hostinger PHP files & build FrmAnTsiTeam bundle
        run: |
          cd web
          for f in hostinger-php/*.php hostinger-php/lib/*.php; do php -l "$f"; done
          bash hostinger-php/build_package.sh

      - name: Upload FrmAnTsiTeam bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrmAnTsiTeam
          path: web/dist/FrmAnTsiTeam

      - name: Check optional Hostinger & Cloudflare deploy secrets
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$FTP_SERVER" && -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]; then
            echo "has_ftp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ftp=false" >> "$GITHUB_OUTPUT"
          fi
          base_dir="${FTP_DIR:-./}"
          [[ "$base_dir" != */ ]] && base_dir="${base_dir}/"
          if [[ "$base_dir" == */FrmAnTsiTeam/ ]]; then
            target_dir="$base_dir"
          else
            target_dir="${base_dir}FrmAnTsiTeam/"
          fi
          echo "ftp_dir=$target_dir" >> "$GITHUB_OUTPUT"
          if [[ -n "$CF_ZONE" && -n "$CF_TOKEN" ]]; then
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Hostinger FrmAnTsiTeam via SFTP (port 65002)
        if: steps.cfg.outputs.has_ftp == 'true'
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          TARGET_DIR: ${{ steps.cfg.outputs.ftp_dir }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" -p 65002 "sftp://${FTP_SERVER}" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 2;
            mkdir -p ${TARGET_DIR};
            mirror -R --verbose --no-perms --exclude '^data/' --exclude '^config\.php$' web/dist/FrmAnTsiTeam/ ${TARGET_DIR};
            bye
          "

      - name: Purge Cloudflare static HTML cache on deploy
        if: steps.cfg.outputs.has_cf == 'true'
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://twisted23.com/FrmAnTsiTeam/","https://twisted23.com/FrmAnTsiTeam/index.html","https://twisted23.com/FrmAnTsiTeam/app.js","https://twisted23.com/FrmAnTsiTeam/styles.css"]}'
